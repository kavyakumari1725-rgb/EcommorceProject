version: "3.9"

services:
  web:
    build:
      context: .
    container_name: django_shop_dev
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - media:/app/media
      - staticfiles:/app/staticfiles
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=shop.settings
    # No database needed now (SQLite works fine)
volumes:
  media:
  staticfiles:
