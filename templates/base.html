<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Shop{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <style> header, main { max-width: 1100px; margin: 0 auto; } .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; } .product img {width: 100%; height: 180px; object-fit: cover; } </style>
</head>
<body>
  <header>
    <nav>
      <ul>
        <li><strong><a href="/">Django Shop</a></strong></li>
      </ul>
      <ul>
        <li><a href="/cart/">Cart ({{ cart|length }})</a></li>
        {% if request.user.is_authenticated %}
        <li><a href="/admin/">Admin</a></li>
        {% else %}
        <li><a href="/admin/login/">Login</a></li>
        {% endif %}
      </ul>
    </nav>
  </header>
  <main>
    {% for message in messages %}<div role="alert">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
