name: Django CI/CD Pipeline

on:
  push:
    branches: [ "main", "feature" ]   # adjust as needed
  pull_request:
    branches: [ "main", "feature" ]

jobs:
  # ---------- CI: Build & Test ----------
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]

    env:
      DJANGO_SETTINGS_MODULE: shop.settings
      DEBUG: 0
      SECRET_KEY: test-secret-key
      ALLOWED_HOSTS: 127.0.0.1,localhost

    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ⚙️ Run migrations
        run: python manage.py migrate

      - name: 🧪 Run Django tests
        run: python manage.py test

  # ---------- CD: Build & Push Docker image ----------
  deploy:
    name: 🚀 Build & Push to Docker Hub
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature'

    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: 🏗️ Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/ecommerceproject:latest
